# gitleaks config for Incubator (public strategic-ideas pipeline repo).
# Operator-specific PII rules loaded from .gitleaks-operator-rules.toml
# (gitignored symlink -> ~/bin/dotty-private/gitleaks-operator-rules.toml).

title = "Incubator gitleaks config"

[extend]
path = ".gitleaks-operator-rules.toml"

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''CLAUDE\.md$''',
  '''CLAUDE\.sample\.md$''',
  '''.claude/rules/''',
  '''LICENSE$''',
]
