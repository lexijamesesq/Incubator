# CI-only gitleaks config — mirrors .gitleaks.toml WITHOUT the [extend] that
# pulls in the operator's private PII ruleset. A GitHub Actions runner has no
# operator-rules file installed, so that extend can't resolve here. This file
# runs gitleaks' base ruleset only; the operator's PII rules keep gating
# every local commit/push through the unchanged .gitleaks.toml the
# pre-commit hooks (gitleaks-staged/-pre-push/-commit-msg) still use. Same
# shape as hazel's, dotty-private's, home-assistant-tools', and Metrics'
# .gitleaks-ci.toml (LEX-675, LEX-679, LEX-680, LEX-711).

title = "Incubator gitleaks config (CI — base rules only)"

# A config file with no [[rules]] and no [extend] loads ZERO rules — it does
# NOT fall back to gitleaks' embedded defaults on its own (verified in
# hazel's CI, LEX-675). useDefault = true is the documented way to inherit
# gitleaks' built-in ruleset while still layering this file's own
# [allowlist] on top of it.
[extend]
useDefault = true

[allowlist]
paths = [
  '''\.gitleaks(-ci)?\.toml$''',
  '''instance\.sample\.md$''',
  '''LICENSE$''',
]
